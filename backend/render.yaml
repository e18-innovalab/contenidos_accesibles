# Blueprint de Render para la web de pruebas (web/): Static Site gratuito, sin build.
# El backend sigue en Railway (railway.json); esta web solo consume su API.
# Después del primer deploy, definir en el backend TEST_WEB_URL=<url de este sitio>
# para habilitar CORS y el enlace desde /admin.
services:
  - type: web
    name: innovalab-web-pruebas
    runtime: static
    rootDir: web
    buildCommand: echo "Sitio estático, sin build"
    staticPublishPath: .
    headers:
      # Sin caché: cada deploy se ve al instante (son 4 archivos chicos)
      - path: /*
        name: Cache-Control
        value: no-cache
